# Persistent vector store: --spring.profiles.active=milvus (Milvus from deploy/milvus/docker-compose.yml).
# Schema / business-knowledge vectors then survive restarts; the default profile keeps the in-memory SimpleVectorStore.
spring:
  ai:
    vectorstore:
      type: milvus
      milvus:
        client:
          host: ${MILVUS_HOST:127.0.0.1}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:root}
          password: ${MILVUS_PASSWORD:milvus}
        database-name: ${MILVUS_DATABASE:default}
        collection-name: ${MILVUS_COLLECTION:gbi_agent_vectors}
        # must equal the embedding model's output size (qwen3.7-text-embedding: 1024)
        embedding-dimension: ${MILVUS_EMBEDDING_DIMENSION:1024}
        index-type: HNSW
        index-parameters: '{"M":16,"efConstruction":200}'
        metric-type: COSINE
        initialize-schema: true
