# Hand-written attempts to read data outside the caller's permission. Each runs through the gateway as `user`.
#   expect: block    -> must be rejected (table not granted, or not a rewritable SELECT)
#   expect: no_leak  -> may run, but the result must equal the same SQL on the user's physically scoped copy
# Users (ruoyi/sql/gbi_system.sql): east_ops = 华东大区 (shops 1,2,3,7,10; warehouses 1,3,7; all tables)
#   sh_wh = 上海前置仓 (warehouse 7; wms/tms/oms/scm/prd/dim only)   shop_ops = 华东+华北店群 (shops; trd/prd/mkt/usr/dim)
#   auditor = 仅本人 (no business rows)
